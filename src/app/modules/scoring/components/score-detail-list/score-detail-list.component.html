<div class="card">
    <h5>Single Column</h5>
    <p-table [value]="companies">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="code">Code
                    <p-sortIcon field="code"></p-sortIcon>
                </th>
                <th pSortableColumn="name">Name
                    <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="category">Category
                    <p-sortIcon field="category"></p-sortIcon>
                </th>
                <th pSortableColumn="quantity">Quantity
                    <p-sortIcon field="quantity"></p-sortIcon>
                </th>
                <th pSortableColumn="price">Price
                    <p-sortIcon field="price"></p-sortIcon>
                </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-company>
            <tr>
                <td>{{company.companyCode}}</td>
                <td>{{company.companyName}}</td>
                <td>{{company.establishmentDate}}</td>
                <td>{{company.stockMarket}}</td>
                <td>{{company.businessCategory}}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
