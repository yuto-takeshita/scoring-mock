<div class="password">
    <svg-icon class="icon" src="assets/images/icons/key.svg" [applyCss]="true"></svg-icon>
    <input [type]="isVisible ? 'text' : 'password'" class="input-item-lg" [placeholder]="placeholder" [formControl]="form" />
    <input class="hidden" id="toggle-{{ formId }}" type="checkbox" (change)="onChangeVisibility($event)" />
    <label for="toggle-password"></label>
</div>
